# CipherGate starter policy — TEMPLATE, REVIEW BEFORE USE.
#
# Generated by `ciphergate init`. It is a conservative starting point, not a guaranteed-safe or
# compliant configuration. Review every rule against your data, environments and destinations.
# Context (environment/destination) is NOT pinned: supply it per run, e.g.
#   ciphergate inspect app.log --policy ciphergate-policy.yml --environment dev --destination local_dev
policy_version: 1
name: starter-policy
metadata:
  description: "Starter template generated by ciphergate init. Template requiring review."
  template: true
requirements:
  environment: true
  destination: true
settings:
  strict: true
  scan_json_keys: true  # keys can carry data; required for untrusted destinations
  unknown_sensitive_behavior: review
  fail_on_parse_error: true
  report_raw_values: false
  rescan:
    enabled: true
rules:
  - id: block-credentials-untrusted
    description: Credentials never leave for external, public or unknown destinations.
    hard: true
    priority: 1000
    match:
      categories: [credential.secret]
      destinations: [external_vendor, external_ai, public_repository, unknown]
    action: block
    reason: credentials_not_permitted_for_destination

  - id: redact-credentials
    description: Elsewhere, remove credentials completely (no partial masking).
    priority: 900
    match:
      categories: [credential.secret]
    action: redact
    reason: remove_credential

  - id: redact-telemetry-untrusted
    priority: 400
    match:
      categories: [network.telemetry, security.internal]
      destinations: [external_vendor, external_ai, public_repository, unknown]
    action: redact
    reason: hide_internal_infrastructure

  - id: keep-telemetry-internal
    description: Internal hosts, private IPs and trace IDs are useful for internal debugging.
    priority: 400
    match:
      categories: [network.telemetry]
      destinations: [local_dev, approved_internal, staging_test, production_monitoring]
    action: allow
    reason: keep_debug_context_internally

  - id: redact-personal-and-sensitive
    priority: 300
    match:
      categories:
        - pii.*
        - health.phi
        - financial.sensitive
        - employment.sensitive
        - security.internal
    action: redact
    reason: remove_identifier

defaults:
  date.generic:
    action: allow
  location.coarse:
    action: redact
  identifier.generic:
    action: review
