# Dependency update PRs (GitHub-hosted service; runs on GitHub, not in CipherGate's runtime).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # pyproject.toml declares supported ranges for a library, not pins: only widen a range when a
    # new release falls outside it. Raising a lower bound needs a reason and an update of
    # ci/constraints-min.txt (tested by the min-deps CI job).
    versioning-strategy: increase-if-necessary
    # Deliberately pinned to the lowest supported versions for the min-deps CI job; updating it
    # would stop testing the real floors (tests/tooling/test_ci_supply_chain.py also guards this).
    exclude-paths:
      - "ci/constraints-min.txt"
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    # Actions are pinned to commit SHAs; Dependabot updates the SHA and its version comment.
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
